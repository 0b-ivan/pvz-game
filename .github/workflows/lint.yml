name: Lint

on: pull_request

permissions:
    contents: read

jobs:
    oxlint:
        runs-on: ubuntu-24.04
        steps:
            - uses: actions/checkout@v4

            - name: Lint maintained browser integration code
              run: |
                  npx --yes oxlint@latest --format=github \
                    game/js/Mobile.js \
                    service-worker.js
