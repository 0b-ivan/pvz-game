name: Viewport and touch gameplay

on:
  pull_request:
    branches: [main, staging]
    paths:
      - 'game/**'
      - 'scripts/test-viewport.cjs'
      - 'scripts/*pak*'
      - 'docs/pak-import.json'
      - 'scripts/build.sh'
      - 'scripts/stamp-build.cjs'
      - 'service-worker.js'
      - 'package*.json'
      - '.github/workflows/viewport.yml'

permissions:
  contents: read

jobs:
  viewport:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow==11.3.0
      - run: python scripts/test-pak-assets.py
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
        env:
          CF_PAGES_COMMIT_SHA: ${{ github.sha }}
      - run: npm run test:viewport
