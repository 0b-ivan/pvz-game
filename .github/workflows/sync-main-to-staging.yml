name: Sync main to staging

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-main-to-staging
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging
        uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0

      - name: Ensure staging contains main
        run: |
          set -euo pipefail

          git fetch origin main staging

          if git merge-base --is-ancestor origin/main origin/staging; then
            echo "staging already contains main"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git checkout -B staging origin/staging
          git merge --no-edit origin/main
          git push origin HEAD:staging

      - name: Verify branch invariant
        run: |
          git fetch origin main staging
          git merge-base --is-ancestor origin/main origin/staging
